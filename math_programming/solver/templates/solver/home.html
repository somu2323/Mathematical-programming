<!DOCTYPE html>
<html lang="en">
<head>
    <title>Linear Programming Solver</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Linear Programming Solver</h1>
        <p class="text-center">Select a method and enter your constraints</p>

        <div class="card shadow p-4">
            <form id="lpForm" method="post">
                {% csrf_token %}

                <!-- Method Selection -->
                <div class="mb-3">
                    <label><strong>Select Method:</strong></label>
                    <select name="method" class="form-select" required>
                        <option value="simplex">Simplex Method</option>
                        <option value="graphical">Graphical Method</option>
                    </select>
                </div>

                <!-- Objective Function -->
                <div class="mb-3">
                    <label><strong>Objective Function:</strong></label>
                    <select name="objective" class="form-select" required>
                        <option value="max">Maximize</option>
                        <option value="min">Minimize</option>
                    </select>
                </div>

                <!-- Objective Function Coefficients -->
                <h4>Objective Function</h4>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label>Coefficient of x₁</label>
                        <input type="number" name="obj_x1" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label>Coefficient of x₂</label>
                        <input type="number" name="obj_x2" class="form-control" required>
                    </div>
                </div>

                <!-- Constraint Section -->
                <h4>Constraints</h4>
                <div id="constraints-container">
                    <div class="row constraint-row mb-2">
                        <div class="col-md-4">
                            <label>Constraint x₁</label>
                            <input type="number" class="form-control" name="con_x1[]" required>
                        </div>
                        <div class="col-md-4">
                            <label>Constraint x₂</label>
                            <input type="number" class="form-control" name="con_x2[]" required>
                        </div>
                        <div class="col-md-3">
                            <label>RHS</label>
                            <input type="number" class="form-control" name="con_rhs[]" required>
                        </div>
                        <div class="col-md-1 d-flex align-items-end">
                            <button type="button" class="btn btn-danger remove-btn">X</button>
                        </div>
                    </div>
                </div>

                <!-- Add Constraint Button -->
                <button type="button" class="btn btn-primary mt-3" id="add-constraint">Add Constraint</button>

                <!-- Solve Button -->
                <button type="submit" class="btn btn-success btn-lg mt-4 w-100">Proceed</button>
            </form>
        </div>
    </div>

    <!-- JavaScript for Dynamic Constraints -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const constraintsContainer = document.getElementById("constraints-container");
            const addConstraintBtn = document.getElementById("add-constraint");

            // Add new constraint row
            addConstraintBtn.addEventListener("click", function() {
                const newConstraint = document.createElement("div");
                newConstraint.classList.add("row", "constraint-row", "mb-2");
                newConstraint.innerHTML = `
                    <div class="col-md-4">
                        <input type="number" class="form-control" name="con_x1[]" required>
                    </div>
                    <div class="col-md-4">
                        <input type="number" class="form-control" name="con_x2[]" required>
                    </div>
                    <div class="col-md-3">
                        <input type="number" class="form-control" name="con_rhs[]" required>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-danger remove-btn">X</button>
                    </div>
                `;
                constraintsContainer.appendChild(newConstraint);
            });

            // Remove constraint row
            constraintsContainer.addEventListener("click", function(event) {
                if (event.target.classList.contains("remove-btn")) {
                    event.target.closest(".constraint-row").remove();
                }
            });

            // Serialize constraints and submit
            document.getElementById("lpForm").addEventListener("submit", function(event) {
                event.preventDefault(); // Prevent default submission

                let constraints = [];
                document.querySelectorAll(".constraint-row").forEach(row => {
                    constraints.push({
                        x1: row.querySelector("input[name='con_x1[]']").value,
                        x2: row.querySelector("input[name='con_x2[]']").value,
                        rhs: row.querySelector("input[name='con_rhs[]']").value
                    });
                });

                // Create hidden input to send constraints as JSON
                let constraintsInput = document.createElement("input");
                constraintsInput.type = "hidden";
                constraintsInput.name = "constraints";
                constraintsInput.value = JSON.stringify(constraints);
                this.appendChild(constraintsInput);

                this.submit(); // Now submit the form
            });
        });
    </script>
</body>
</html>
